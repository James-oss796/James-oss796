<svg width="1200" height="300" viewBox="0 0 1200 300"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="300">
      <stop offset="0%" stop-color="#23262F"/>
      <stop offset="55%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#23262F"/>
    </linearGradient>

    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B6FF2E"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#F8F7F4" stroke-opacity=".055"/>
    </pattern>

    <filter id="blur">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="18" fill="url(#background)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- Ambient glow -->
  <circle cx="1050" cy="80" r="120"
          fill="#B6FF2E" fill-opacity=".13" filter="url(#blur)"/>

  <circle cx="700" cy="300" r="130"
          fill="#064E3B" fill-opacity=".45" filter="url(#blur)"/>

  <!-- Architecture connections -->
  <g stroke="#B6FF2E" stroke-opacity=".25" stroke-width="1.2">
    <path d="M800 40L950 100L1080 45L1160 130"/>
    <path d="M950 100L1000 220L1150 250"/>
    <path d="M1080 45L1080 180L1000 220"/>
    <path d="M800 40L820 180L1000 220"/>
    <path d="M820 180L950 100"/>
  </g>

  <!-- Nodes -->
  <g fill="#B6FF2E">
    <circle cx="800" cy="40" r="3"/>
    <circle cx="950" cy="100" r="4"/>
    <circle cx="1080" cy="45" r="3"/>
    <circle cx="1160" cy="130" r="3"/>
    <circle cx="1000" cy="220" r="4"/>
    <circle cx="1150" cy="250" r="3"/>
    <circle cx="820" cy="180" r="3"/>
    <circle cx="1080" cy="180" r="3"/>
  </g>

  <!-- Animated accent -->
  <circle r="3" fill="#B6FF2E">
    <animateMotion dur="9s" repeatCount="indefinite"
      path="M800 40L950 100L1080 45L1160 130"/>
  </circle>

  <!-- Accent line -->
  <rect x="78" y="82" width="5" height="110"
        rx="2.5" fill="#B6FF2E"/>

  <!-- Name -->
  <text x="105" y="133"
        fill="#F8F7F4"
        font-family="Arial, Helvetica, sans-serif"
        font-size="43"
        font-weight="700"
        letter-spacing="1">
    JAMES BRIAN NDUNG'U
  </text>

  <!-- Professional identity -->
  <text x="108" y="172"
        fill="#B6FF2E"
        font-family="monospace"
        font-size="15"
        letter-spacing="3">
    SOFTWARE ENGINEER / BACKEND / SYSTEMS
  </text>

  <!-- Small technical signature -->
  <text x="108" y="224"
        fill="#F8F7F4"
        fill-opacity=".5"
        font-family="monospace"
        font-size="11"
        letter-spacing="2">
    DESIGNING  ·  BUILDING  ·  ENGINEERING
  </text>

  <!-- Bottom accent -->
  <rect x="78" y="275" width="1044" height="1"
        fill="#B6FF2E" fill-opacity=".25"/>

</svg>

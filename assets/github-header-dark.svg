<svg width="1200" height="300" viewBox="0 0 1200 300"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="300">
      <stop offset="0%" stop-color="#23262F"/>
      <stop offset="55%" stop-color="#1E1033"/>
      <stop offset="100%" stop-color="#23262F"/>
    </linearGradient>

    <radialGradient id="violetOrb">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity=".75"/>
      <stop offset="55%" stop-color="#6A00F4" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#6A00F4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="limeOrb">
      <stop offset="0%" stop-color="#E5FFAA" stop-opacity=".9"/>
      <stop offset="50%" stop-color="#B6FF2E" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#B6FF2E" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emeraldOrb">
      <stop offset="0%" stop-color="#34D399" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B6FF2E"/>
      <stop offset="100%" stop-color="#6A00F4"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            stroke="#F8F7F4"
            stroke-opacity=".045"/>
    </pattern>

    <filter id="blur">
      <feGaussianBlur stdDeviation="32"/>
    </filter>

    <filter id="softBlur">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <clipPath id="frame">
      <rect width="1200" height="300" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">

    <!-- Background -->
    <rect width="1200" height="300" fill="url(#background)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- Ambient light -->
    <circle cx="1010" cy="100" r="150"
            fill="#6A00F4" fill-opacity=".13"
            filter="url(#blur)"/>

    <circle cx="800" cy="280" r="140"
            fill="#064E3B" fill-opacity=".22"
            filter="url(#blur)"/>

    <!-- Floating luminous orbs -->

    <g>

      <circle cx="930" cy="85" r="90"
              fill="url(#violetOrb)" filter="url(#softBlur)">
        <animateTransform attributeName="transform"
          type="translate" values="0 0; -24 17; 12 -12; 0 0"
          dur="13s" repeatCount="indefinite"/>
      </circle>

      <circle cx="930" cy="85" r="43"
              fill="#6A00F4" fill-opacity=".10"
              stroke="#A78BFA" stroke-opacity=".22"/>

      <circle cx="930" cy="85" r="43"
              stroke="#A78BFA" stroke-opacity=".25"
              stroke-width="1">
        <animate attributeName="r"
          values="43;49;43"
          dur="8s" repeatCount="indefinite"/>
      </circle>

      <circle cx="1090" cy="205" r="100"
              fill="url(#limeOrb)" filter="url(#softBlur)">
        <animateTransform attributeName="transform"
          type="translate" values="0 0; -17 -25; 13 10; 0 0"
          dur="16s" repeatCount="indefinite"/>
      </circle>

      <circle cx="1090" cy="205" r="48"
              fill="#B6FF2E" fill-opacity=".07"
              stroke="#B6FF2E" stroke-opacity=".25"/>

      <circle cx="1090" cy="205" r="48"
              stroke="#B6FF2E" stroke-opacity=".3">
        <animate attributeName="r"
          values="48;54;48"
          dur="10s" repeatCount="indefinite"/>
      </circle>

      <circle cx="800" cy="235" r="80"
              fill="url(#emeraldOrb)" filter="url(#blur)">
        <animateTransform attributeName="transform"
          type="translate" values="0 0; 25 -12; -15 8; 0 0"
          dur="18s" repeatCount="indefinite"/>
      </circle>

    </g>

    <!-- Subtle orbit paths -->
    <g stroke-width="1" fill="none">
      <ellipse cx="1010" cy="140" rx="190" ry="95"
               stroke="#B6FF2E" stroke-opacity=".12"
               transform="rotate(-22 1010 140)"/>

      <ellipse cx="1010" cy="140" rx="145" ry="68"
               stroke="#A78BFA" stroke-opacity=".14"
               transform="rotate(28 1010 140)"/>
    </g>

    <!-- Architectural connections -->
    <g stroke="url(#accent)" stroke-opacity=".35"
       stroke-width="1.2">

      <path d="M800 40L950 100L1080 45L1160 130"/>
      <path d="M950 100L1000 220L1150 250"/>
      <path d="M1080 45L1080 180L1000 220"/>
      <path d="M800 40L820 180L1000 220"/>
      <path d="M820 180L950 100"/>

    </g>

    <!-- Network nodes -->
    <g fill="#B6FF2E">

      <circle cx="800" cy="40" r="3"/>
      <circle cx="950" cy="100" r="4"/>
      <circle cx="1080" cy="45" r="3"/>
      <circle cx="1160" cy="130" r="3"/>
      <circle cx="1000" cy="220" r="4"/>
      <circle cx="1150" cy="250" r="3"/>
      <circle cx="820" cy="180" r="3"/>
      <circle cx="1080" cy="180" r="3"/>

    </g>

    <!-- Travelling signal -->
    <circle r="4" fill="#B6FF2E">
      <animateMotion dur="11s" repeatCount="indefinite"
        path="M800 40L950 100L1080 45L1160 130"/>
    </circle>

    <circle r="2" fill="#F8F7F4">
      <animateMotion dur="15s" repeatCount="indefinite"
        path="M820 180L950 100L1000 220L1150 250"/>
    </circle>

    <!-- Identity accent -->
    <rect x="78" y="78" width="5" height="124"
          rx="2.5" fill="#B6FF2E"/>

    <!-- Name -->
    <text x="105" y="133"
          fill="#F8F7F4"
          font-family="Arial, Helvetica, sans-serif"
          font-size="43"
          font-weight="700"
          letter-spacing="1">
      JAMES BRIAN NDUNG'U
    </text>

    <!-- Professional title -->
    <text x="108" y="174"
          fill="#B6FF2E"
          font-family="monospace"
          font-size="17"
          letter-spacing="2">
      BACKEND SOFTWARE ENGINEER / SYSTEMS
    </text>

    <!-- Visible signature -->
    <text x="108" y="229"
          fill="#F8F7F4"
          fill-opacity=".82"
          font-family="monospace"
          font-size="19"
          font-weight="500"
          letter-spacing=".8">
      DESIGNING  ·  BUILDING  ·  ENGINEERING
    </text>

    <!-- Bottom accent -->
    <rect x="78" y="275" width="1044" height="1"
          fill="#B6FF2E" fill-opacity=".28"/>

  </g>

</svg>
